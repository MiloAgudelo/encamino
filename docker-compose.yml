# Entorno LOCAL para desarrollar EnCamino contra karamba-backend:
# PostgreSQL 17 (la misma versión mayor que producción) y el backend de Django.
# Nunca apunta a la base real. Ver docs/desarrollo-local.md.
name: encamino

services:
  postgres:
    image: postgres:17-alpine
    container_name: encamino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: encamino
      POSTGRES_PASSWORD: encamino
      # Django usa la base "postgres", que la imagen crea por defecto en UTF-8.
    ports:
      - "5437:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encamino -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # Copia local de riveragiraldo/karamba-backend, por defecto junto a este repo.
    build:
      context: ./docker
      dockerfile: backend.Dockerfile
      additional_contexts:
        backend: ${KARAMBA_BACKEND_DIR:-../karamba-backend}
    container_name: encamino-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # SECRET_KEY, DEBUG y ALLOWED_HOSTS_EXTRA salen del .env del backend;
    # la conexión a la base se fija aquí para que siempre sea el contenedor local.
    env_file:
      - ${KARAMBA_BACKEND_DIR:-../karamba-backend}/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: encamino
      DB_PASSWORD: encamino
      DEBUG: "True"
    ports:
      - "8000:8000"
    volumes:
      - ${KARAMBA_BACKEND_DIR:-../karamba-backend}:/app
      - ./datos/semilla:/datos:ro

volumes:
  datos-postgres:
